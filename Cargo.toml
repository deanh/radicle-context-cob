[package]
name = "radicle-context-cob"
version = "0.2.1"
edition = "2021"
description = "Radicle Collaborative Object type for AI session context"
license = "MIT OR Apache-2.0"
keywords = ["radicle", "cob", "context", "ai", "collaboration"]
categories = ["development-tools", "command-line-utilities"]
rust-version = "1.85.0"

[lib]
name = "radicle_context_cob"
path = "src/lib.rs"

[[bin]]
name = "rad-context"
path = "src/main.rs"

[dependencies]
# Radicle core - using git dependencies for portability
radicle = { git = "https://seed.radicle.xyz/z3gqcJUoA1n9HaHKufZs5FCSGazv5.git", package = "radicle", version = "0.25.1" }
radicle-cob = { git = "https://seed.radicle.xyz/z3gqcJUoA1n9HaHKufZs5FCSGazv5.git", package = "radicle-cob", version = "0.21.1" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = { version = "2", default-features = false }

# Collections
nonempty = "0.9.0"

# CLI
anyhow = "1"
clap = { version = "4.0", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

[lints.clippy]
type_complexity = "allow"
enum_variant_names = "allow"
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
must_use_candidate = "deny"

[dev-dependencies]
pretty_assertions = "1.0"
tempfile = "3"
